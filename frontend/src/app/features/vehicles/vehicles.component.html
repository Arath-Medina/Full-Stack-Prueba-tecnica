<section class="page">

  <div class="page-header">
    <div>
      <h1>Vehículos</h1>
      <p class="muted">Registro y consulta de vehiculos.</p>
    </div>
  </div>

  <div class="grid grid-2">
    <div class="card">
      <h2>Registrar vehículo</h2>
      <form [formGroup]="form" (ngSubmit)="registrarVehiculo()" class="form-grid">
        <mat-form-field>
          <mat-label> Placa </mat-label>
          <input matInput formControlName="placa" maxlength="10" autocomplete="off" />
        </mat-form-field>
        <mat-form-field>
          <mat-label> Tipo </mat-label>
          <mat-select formControlName="tipo">
            <mat-option *ngFor="let t of tipos" [value]="t.nombre">
              {{ t.nombre }} · {{ t.tarifaPorMinuto | currency: 'MXN' }}/min
            </mat-option>
          </mat-select>
        </mat-form-field>
        <div class="full">
          <button mat-flat-button type="submit" [disabled]="form.invalid || saving">
            <mat-icon> add </mat-icon>
            Registrar
          </button>
        </div>
      </form>
    </div>
    <div class="card">
      <h2>Buscar</h2>
      <mat-form-field class="full">
        <mat-label> Filtrar por placa </mat-label>
        <input matInput (input)="filter($event)" />
        <mat-icon matSuffix> search </mat-icon>
      </mat-form-field>
      <p class="muted">{{ data.data.length }} vehículos registrados.</p>
    </div>
  </div>

  <div class="card" style="margin-top: 18px">
    <div class="table-wrap">
      <table mat-table [dataSource]="data" matSort>
        <ng-container matColumnDef="placa">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Placa</th>
          <td mat-cell *matCellDef="let v">
            <b>
              {{ v.placa }}
            </b>
          </td>
        </ng-container>
        <ng-container matColumnDef="tipo">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Tipo</th>
          <td mat-cell *matCellDef="let v">
            <span class="status">
              {{ v.tipo }}
            </span>
          </td>
        </ng-container>
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let v">
            <a mat-button [routerLink]="['/vehiculos', v.placa]">
              Ver detalle
              <mat-icon> chevron_right </mat-icon>
            </a>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="cols"></tr>
        <tr mat-row *matRowDef="let row; columns: cols"></tr>
      </table>
    </div>
    <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 15]"> </mat-paginator>
  </div>

</section>
