<section class="page">

  <div class="page-header">
    <div>
      <h1>Reporte de residentes</h1>
      <p class="muted">Corte mensual de tiempo acumulado y monto correspondiente.</p>
    </div>
    <div class="card total">
      <span class="muted"> Total </span>
      <strong>
        {{ total | currency: 'MXN' }}
      </strong>
    </div>
  </div>

  <div class="card">
    <mat-form-field>
      <mat-label> Filtrar por placa </mat-label>
      <input matInput (input)="filter($event)" />
      <mat-icon matSuffix> search </mat-icon>
    </mat-form-field>
    <div class="table-wrap">
      <table mat-table [dataSource]="data" matSort>
        <ng-container matColumnDef="placa">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Placa</th>
          <td mat-cell *matCellDef="let x">
            <b>
              {{ x.placa }}
            </b>
          </td>
        </ng-container>
        <ng-container matColumnDef="minutos">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Minutos</th>
          <td mat-cell *matCellDef="let x">
            {{ x.minutosAcumulados }}
          </td>
        </ng-container>
        <ng-container matColumnDef="tarifa">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Tarifa/min</th>
          <td mat-cell *matCellDef="let x">
            {{ x.tarifaPorMinuto | currency: 'MXN' }}
          </td>
        </ng-container>
        <ng-container matColumnDef="total">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Total</th>
          <td mat-cell *matCellDef="let x">
            <b>
              {{ x.total | currency: 'MXN' }}
            </b>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="cols"></tr>
        <tr mat-row *matRowDef="let row; columns: cols"></tr>
      </table>
    </div>
    <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 15]"> </mat-paginator>
  </div>

</section>
